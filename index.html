<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2ece1">
  <title>Classic Cover Maker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;700&family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= BARRA SUPERIOR ================= -->
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="resources/penguin.png" alt="">
      <div>
        <h1>Classic Cover Maker</h1>

      </div>
    </div>

    <!-- Toggle del limón (esquina superior derecha) -->
    <label class="switch lemon-chip">
      <img src="resources/lemon.png" alt="" width="18" height="18">
      <span class="switch-text"></span>
      <input type="checkbox" id="lemon">
      <span class="track"></span>
    </label>
  </header>

  <main class="layout">

    <!-- ================= PORTADA ================= -->
    <section class="stage" aria-label="Vista previa">
      <div class="cover" id="cover" data-logo="penguin" data-omega="false" data-lemon="false">

        <div class="art" id="art">
          <span class="lemon" aria-hidden="true"></span>
        </div>

        <div class="band">
          <span class="band-text" id="out-band-text">PENGUIN</span>
          <span class="logo" role="img" aria-label="Logo"></span>
          <span class="band-classics"><span class="omega">Ω</span>CLASSICS</span>
        </div>

        <div class="info">
          <p class="author" id="out-author">Autor</p>
          <p class="title" id="out-title">Título</p>
          <p class="subtitle" id="out-subtitle"></p>
        </div>

      </div>
    </section>

    <!-- ================= PANEL ================= -->
    <form class="panel" id="form" onsubmit="return false" autocomplete="off">

      <fieldset class="group">
        <legend>Data</legend>

        <label class="field">
          <span>Author</span>
          <input type="text" id="author" value="Autor" maxlength="40" enterkeyhint="next">
        </label>

        <label class="field">
          <span>Title</span>
          <input type="text" id="title" value="Título" maxlength="80" enterkeyhint="next">
        </label>

        <label class="field">
          <span>Subtitle</span>
          <input type="text" id="subtitle" maxlength="80" enterkeyhint="done">
        </label>

        <div class="size-row">
          <span>Title size</span>
          <div class="stepper">
            <button type="button" id="size-down" aria-label="Reducir título">A&minus;</button>
            <output id="size-value">26</output>
            <button type="button" id="size-up" aria-label="Aumentar título">A+</button>
          </div>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Image</legend>

        <label class="upload" for="image-file">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3"/>
            <circle cx="9" cy="10" r="1.6"/>
            <path d="M4 18l5-5 4 4 3-3 4 4"/>
          </svg>
          <span>
            <b>Choose Image</b>
            <small id="file-name">JPG, PNG o WebP</small>
          </span>
          <input type="file" id="image-file" accept="image/*" class="visually-hidden">
        </label>
      </fieldset>

      <fieldset class="group">
        <legend>White band</legend>

        <label class="field">
          <span>Left side text</span>
          <input type="text" id="band-text" value="PENGUIN" maxlength="14" enterkeyhint="done">
        </label>

        <label class="field">
          <span>Logo</span>
          <select id="logo-select">
            <option value="penguin" selected>Penguin</option>
            <option value="ao3">AO3</option>
            <option value="fanfiction">Fan fiction</option>
            <option value="wattpad">Wattpad</option>
          </select>
        </label>

        <label class="switch row">
          <span class="switch-text">Ω</span>
          <input type="checkbox" id="omega">
          <span class="track"></span>
        </label>
      </fieldset>

      <button type="button" class="btn-download" id="download">Download</button>
    </form>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
